; Limiti PHP per caricare video dal telefono. Funziona sull'hosting PHP-FPM
; (la maggior parte dei piani Aruba); se il tuo hosting usa mod_php classico
; questo file viene ignorato e i limiti vanno alzati dal pannello di controllo.
upload_max_filesize = 200M
post_max_size = 200M
max_execution_time = 300
max_input_time = 300
